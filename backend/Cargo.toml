[package]
name    = "yoka-backend"
version = "0.1.0"
edition = "2021"

[lib]
name = "yoka"
path = "src/lib.rs"

[[bin]]
name = "yoka"
path = "src/main.rs"

[dependencies]
# HTTP
axum       = { version = "0.7", features = ["macros"] }
tower      = "0.4"
tower-http = { version = "0.5", features = ["trace", "cors"] }

# Async runtime
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }

# Database — pinned to 0.7 (works on stable 1.75+); upgrade to 0.8 when toolchain updates.
sqlx = { version = "0.7", default-features = false, features = [
    "runtime-tokio-rustls",
    "sqlite",
    "chrono",
    "macros",
    "migrate",
] }

# Serde
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Errors
thiserror = "1"
anyhow    = "1"

# IDs
uuid = { version = "1", features = ["v4"] }

# Logging
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
tokio  = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
http-body-util = "0.1"
mime           = "0.3"

[profile.release]
lto           = "thin"
codegen-units = 1
strip         = true
